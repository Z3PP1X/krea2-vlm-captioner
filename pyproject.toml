[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krea2-pipeline"
version = "0.2.0"
description = "Production data pipeline for Krea 2 LoRA datasets (crawling, quality control, Qwen-VL screening/captioning, and AI-Toolkit export)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ML Engineering Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "Pillow>=10.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "imagehash>=4.3.0",
    "numpy>=1.24.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
gpu = [
    "vllm>=0.6.0",
    "torch>=2.4.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
